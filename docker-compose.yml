version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finpluse_db
    environment:
      POSTGRES_USER: finpluse
      POSTGRES_PASSWORD: finpluse_password
      POSTGRES_DB: finpluse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpluse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/httpsghsthakur/finpluse:latest
    container_name: finpluse_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finpluse:finpluse_password@db:5432/finpluse
      - ENVIRONMENT=production
      - PORT=8000
      - SUPABASE_URL=\
      - SUPABASE_KEY=\
      - OPENAI_API_KEY=\
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - finpluse_models:/app/backend/models

volumes:
  postgres_data:
  finpluse_models:
